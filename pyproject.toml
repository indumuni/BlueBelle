[project]
name = "bluebelle"
version = "0.0.0"
requires-python = ">=3.13"

[tool.uv]
package = false

[tool.uv.workspace]
members = ["apps/*-py", "packages/py/*"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["apps/*/src", "packages/py/*/src"]
extend-exclude = ["templates"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.pytest.ini_options]
addopts = "-q --import-mode=importlib"
norecursedirs = ["templates", ".*", "node_modules"]
