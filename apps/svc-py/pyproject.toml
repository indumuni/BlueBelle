[project]
name = "svc-py"
version = "0.1.0"
description = "Sample FastAPI service (playground smoke test)"
readme = "README.md"
authors = [
    { name = "Indumuni Abeyaratna", email = "indumuni@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.162.0",
    "uvicorn>=0.54.0",
]

[project.scripts]
svc-py = "svc_py.main:run"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
]
