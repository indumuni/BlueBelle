openapi: 3.1.0
info:
  title: BlueBelle backend template health check
  version: 1.0.0
  description: >
    Implemented by every backend template (Go, Python, TypeScript). The
    Lambda Web Adapter polls this path as its readiness check. Only GET is
    specified; other methods on /health are framework-defined (Go and
    Python return 405, TypeScript returns 404) and are not part of this
    contract.
paths:
  /health:
    get:
      operationId: health
      responses:
        "200":
          description: Service is up
          content:
            application/json:
              schema:
                type: object
                required: [status]
                additionalProperties: false
                properties:
                  status:
                    type: string
                    const: ok
              example:
                status: ok
