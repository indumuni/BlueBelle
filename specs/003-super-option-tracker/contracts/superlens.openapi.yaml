openapi: 3.1.0
info:
  title: SuperLens
  version: 1.0.0
  description: |
    Data interface for SuperLens (spec 003). Served by the backend CloudFront distribution and, for the web
    app, proxied unchanged under the frontend distribution (research R17), so both servers expose the same paths:
      - `/data/v1/*`  static, cached (S3).
      - `/api/v1/*`   dynamic (Lambda).
    **v1 has no authentication** (research R18): the address is unadvertised and for personal use only.
    Writes (PUT/DELETE/POST) MUST send `x-amz-content-sha256` = hex SHA-256 of the body, because CloudFront
    signs requests to the Lambda origin (empty body:
    e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855).
    Owner-assisted CSV import is deliberately NOT part of this interface; it writes to S3 with the owner's AWS
    credentials (FR-016b).
    Canonical copy lives at contracts/superlens.openapi.yaml once implementation starts.
servers:
  - url: https://{frontend}.cloudfront.net
    description: Frontend distribution (web app; /data and /api proxied to the backend)
    variables:
      frontend: { default: example-web }
  - url: https://{backend}.cloudfront.net
    description: Backend distribution (used directly by tools such as the MCP server)
    variables:
      backend: { default: example-api }
tags:
  - name: static
    description: Files served from cache. Not generated as server code.
  - name: data
  - name: update
  - name: watchlist

paths:
  /data/v1/manifest.json:
    get:
      tags: [static]
      operationId: getManifest
      responses:
        "200":
          description: All series and their chunk URLs. `Cache-Control public, max-age=60, s-maxage=86400`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Manifest" }

  /data/v1/series/{seriesId}/{chunkFile}:
    get:
      tags: [static]
      operationId: getChunk
      parameters:
        - $ref: "#/components/parameters/SeriesId"
        - name: chunkFile
          in: path
          required: true
          description: "`<year>.<hash12>.json`, taken from the manifest; never constructed by clients."
          schema: { type: string, pattern: "^[0-9]{4}\\.[0-9a-f]{12}\\.json$" }
      responses:
        "200":
          description: Immutable chunk. `Cache-Control public, max-age=31536000, immutable`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Chunk" }
        "404": { description: Unknown chunk (error cached 60 s). }

  /api/v1/series:
    get:
      tags: [data]
      operationId: listSeries
      parameters:
        - name: kind
          in: query
          schema: { $ref: "#/components/schemas/SeriesKind" }
      responses:
        "200":
          description: Series catalogue (FR-015a).
          content:
            application/json:
              schema:
                type: object
                required: [series]
                properties:
                  series:
                    type: array
                    items: { $ref: "#/components/schemas/Series" }

  /api/v1/series/{seriesId}/values:
    get:
      tags: [data]
      operationId: getSeriesValues
      description: Values for a date range, optionally converted to AUD (FR-015a, FR-006e).
      parameters:
        - $ref: "#/components/parameters/SeriesId"
        - { name: from, in: query, required: true, schema: { type: string, format: date } }
        - { name: to, in: query, required: true, schema: { type: string, format: date } }
        - name: currency
          in: query
          schema: { type: string, enum: [AUD, local], default: AUD }
      responses:
        "200":
          description: Points in date order. CSV with `Accept text/csv` (FR-015).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SeriesValues" }
            text/csv:
              schema: { type: string }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/performance:
    get:
      tags: [data]
      operationId: comparePerformance
      description: Period statistics for several series on a common baseline (FR-011). Used by MCP compare_performance.
      parameters:
        - name: series
          in: query
          required: true
          style: form
          explode: false
          schema: { type: array, items: { type: string }, minItems: 1, maxItems: 20 }
        - { name: from, in: query, required: true, schema: { type: string, format: date } }
        - { name: to, in: query, required: true, schema: { type: string, format: date } }
        - name: currency
          in: query
          schema: { type: string, enum: [AUD, local], default: AUD }
      responses:
        "200":
          description: One stats row per series.
          content:
            application/json:
              schema:
                type: object
                required: [from, to, currency, results]
                properties:
                  from: { type: string, format: date }
                  to: { type: string, format: date }
                  currency: { type: string }
                  results:
                    type: array
                    items: { $ref: "#/components/schemas/PeriodStats" }
        "400": { $ref: "#/components/responses/BadRequest" }

  /api/v1/sources:
    get:
      tags: [update]
      operationId: listSources
      responses:
        "200":
          description: Source status and last successful update (FR-007).
          content:
            application/json:
              schema:
                type: object
                required: [sources]
                properties:
                  sources:
                    type: array
                    items: { $ref: "#/components/schemas/DataSource" }

  /api/v1/refresh:
    post:
      tags: [update]
      operationId: requestRefresh
      description: Start an update now (FR-008). Rate-limited by the lock and cooldown (FR-018, SC-001a).
      responses:
        "202":
          description: Started.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UpdateRun" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429":
          description: Within the 5-minute cooldown (FR-018).
          headers:
            Retry-After: { schema: { type: integer } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/v1/runs:
    get:
      tags: [update]
      operationId: listRuns
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 50, default: 10 }
      responses:
        "200":
          description: Most recent runs first.
          content:
            application/json:
              schema:
                type: object
                required: [runs]
                properties:
                  runs:
                    type: array
                    items: { $ref: "#/components/schemas/UpdateRun" }

  /api/v1/runs/{runId}:
    get:
      tags: [update]
      operationId: getRun
      parameters:
        - { name: runId, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: One run.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UpdateRun" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/watchlist:
    get:
      tags: [watchlist]
      operationId: getWatchlist
      responses:
        "200":
          description: Watchlist and UI preferences.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Watchlist" }

  /api/v1/watchlist/{seriesId}:
    put:
      tags: [watchlist]
      operationId: putWatchlistEntry
      parameters:
        - $ref: "#/components/parameters/SeriesId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [group]
              properties:
                group: { type: string, enum: [invested, considering] }
      responses:
        "204": { description: Saved. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [watchlist]
      operationId: deleteWatchlistEntry
      parameters:
        - $ref: "#/components/parameters/SeriesId"
      responses:
        "204": { description: Removed (idempotent). }

  /api/v1/preferences:
    put:
      tags: [watchlist]
      operationId: putPreferences
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Preferences" }
      responses:
        "204": { description: Saved. }
        "400": { $ref: "#/components/responses/BadRequest" }

components:
  parameters:
    SeriesId:
      name: seriesId
      in: path
      required: true
      schema: { type: string, pattern: "^[a-z][a-z0-9-]{1,30}\\.[a-z0-9-]{1,60}$" }

  responses:
    BadRequest:
      description: Invalid input.
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    NotFound:
      description: Not found.
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    Conflict:
      description: An update is already running.
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }

  schemas:
    Error:
      type: object
      required: [code, message]
      properties:
        code: { type: string }
        message: { type: string }

    SeriesKind: { type: string, enum: [option, index, fx, other] }
    Visibility:
      type: string
      enum: [public, private]
      description: Whether the source allows republishing. Recorded only in v1; not enforced (research R18).

    DataSource:
      type: object
      required: [id, name, visibility, attribution, mode]
      properties:
        id: { type: string }
        name: { type: string }
        visibility: { $ref: "#/components/schemas/Visibility" }
        attribution: { type: string }
        mode: { type: string, enum: [fetch, import] }
        lastSuccessAt: { type: [string, "null"], format: date-time }
        lastAttemptAt: { type: [string, "null"], format: date-time }
        lastError: { type: [string, "null"] }
        backfill:
          type: object
          properties:
            state: { type: string, enum: [pending, running, complete] }
            cursor: { type: [string, "null"], format: date }

    Series:
      type: object
      required: [id, sourceId, name, kind, valueType, market, currency, visibility, status]
      properties:
        id: { type: string }
        sourceId: { type: string }
        name: { type: string }
        kind: { $ref: "#/components/schemas/SeriesKind" }
        valueType: { type: string, enum: [return_pct, level] }
        market: { type: string }
        currency: { type: string, pattern: "^[A-Z]{3}$" }
        visibility: { $ref: "#/components/schemas/Visibility" }
        note: { type: string }
        firstDate: { type: string, format: date }
        lastDate: { type: string, format: date }
        status: { type: string, enum: [active, discontinued] }

    Manifest:
      type: object
      required: [version, generatedAt, sources, series]
      properties:
        version: { const: 1 }
        generatedAt: { type: string, format: date-time }
        sources:
          type: array
          items: { $ref: "#/components/schemas/DataSource" }
        series:
          type: array
          items:
            allOf:
              - $ref: "#/components/schemas/Series"
              - type: object
                required: [chunks]
                properties:
                  chunks:
                    type: object
                    description: Year → chunk URL (relative to the origin).
                    additionalProperties: { type: string }

    Chunk:
      type: object
      required: [seriesId, year, points]
      properties:
        seriesId: { type: string }
        year: { type: integer }
        points:
          type: array
          description: "[date, value] or [date, value, revisedAt], sorted by date, unique dates."
          items:
            type: array
            minItems: 2
            maxItems: 3
            prefixItems:
              - { type: string, format: date }
              - { type: number }
              - { type: string, format: date-time }

    SeriesValues:
      type: object
      required: [seriesId, currency, valueType, points]
      properties:
        seriesId: { type: string }
        currency: { type: string }
        valueType: { type: string, enum: [return_pct, level] }
        converted: { type: boolean, description: true when values were converted to AUD }
        points:
          type: array
          items:
            type: object
            required: [date, value]
            properties:
              date: { type: string, format: date }
              value: { type: number }
        gaps:
          type: array
          description: Dates left out because no exchange rate existed within 5 days.
          items: { type: string, format: date }

    PeriodStats:
      type: object
      required: [seriesId, firstDate, lastDate, totalReturnPct]
      properties:
        seriesId: { type: string }
        firstDate: { type: string, format: date, description: first available date inside the range }
        lastDate: { type: string, format: date }
        totalReturnPct: { type: number }
        bestDay: { $ref: "#/components/schemas/DayValue" }
        worstDay: { $ref: "#/components/schemas/DayValue" }
        maxDrawdownPct: { type: number, description: "≤ 0" }
        note: { type: string, description: "e.g. price index, excludes dividends" }

    DayValue:
      type: object
      required: [date, returnPct]
      properties:
        date: { type: string, format: date }
        returnPct: { type: number }

    UpdateRun:
      type: object
      required: [runId, trigger, status, startedAt]
      properties:
        runId: { type: string }
        trigger: { type: string, enum: [schedule, manual, import] }
        status: { type: string, enum: [running, succeeded, partial, failed] }
        startedAt: { type: string, format: date-time }
        finishedAt: { type: [string, "null"], format: date-time }
        perSource:
          type: array
          items:
            type: object
            required: [sourceId]
            properties:
              sourceId: { type: string }
              from: { type: string, format: date }
              to: { type: string, format: date }
              daysAdded: { type: integer }
              daysRevised: { type: integer }
              newSeries: { type: array, items: { type: string } }
              error: { type: [string, "null"] }

    Watchlist:
      type: object
      required: [entries, preferences]
      properties:
        entries:
          type: array
          items:
            type: object
            required: [seriesId, group, addedAt]
            properties:
              seriesId: { type: string }
              group: { type: string, enum: [invested, considering] }
              addedAt: { type: string, format: date-time }
        preferences: { $ref: "#/components/schemas/Preferences" }

    Preferences:
      type: object
      properties:
        period: { type: string, enum: [1W, 1M, 3M, 6M, FYTD, 1Y, 3Y, ALL, CUSTOM] }
        customFrom: { type: string, format: date }
        customTo: { type: string, format: date }
        currencyView: { type: string, enum: [AUD, local] }
        comparisonSeries: { type: array, items: { type: string } }
