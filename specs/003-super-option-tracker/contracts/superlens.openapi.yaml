openapi: 3.1.0
info:
  title: SuperLens
  version: 1.0.0
  description: |
    Data interface for SuperLens (spec 003). One origin (the CloudFront distribution):
      - `/data/v1/*`  public, static, cached (S3). No auth.
      - `/api/v1/*`   owner-only (Lambda). Auth via `X-SuperLens-Token` (Cognito access token, web app)
                      or `X-Api-Key` (tools). `Authorization` is reserved for CloudFront's SigV4 origin signing.
    Write requests (POST/PUT/DELETE) MUST send `x-amz-content-sha256` = hex SHA-256 of the body
    (empty body: e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855).
    Canonical copy lives at contracts/superlens.openapi.yaml once implementation starts.
servers:
  - url: https://{distribution}.cloudfront.net
    variables:
      distribution: { default: example }
security:
  - ownerToken: []
  - apiKey: []
tags:
  - name: public
    description: Static files served from cache. Not generated as server code.
  - name: data
  - name: owner
  - name: update

paths:
  /data/v1/manifest.json:
    get:
      tags: [public]
      operationId: getPublicManifest
      security: []
      responses:
        "200":
          description: Public series and their chunk URLs. `Cache-Control public, max-age=60, s-maxage=86400`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Manifest" }

  /data/v1/series/{seriesId}/{chunkFile}:
    get:
      tags: [public]
      operationId: getPublicChunk
      security: []
      parameters:
        - $ref: "#/components/parameters/SeriesId"
        - name: chunkFile
          in: path
          required: true
          description: "`<year>.<hash12>.json`, taken from the manifest; never constructed by clients."
          schema: { type: string, pattern: "^[0-9]{4}\\.[0-9a-f]{12}\\.json$" }
      responses:
        "200":
          description: Immutable chunk. `Cache-Control public, max-age=31536000, immutable`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Chunk" }
        "404": { description: Unknown chunk (error cached 60 s). }

  /api/v1/me:
    get:
      tags: [owner]
      operationId: getMe
      responses:
        "200":
          description: Who is calling.
          content:
            application/json:
              schema:
                type: object
                required: [kind]
                properties:
                  kind: { type: string, enum: [owner, key] }
                  keyLabel: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/v1/manifest:
    get:
      tags: [data]
      operationId: getFullManifest
      description: All series, public and private. Private chunk URLs point to /api/v1/series/{id}/chunks/{year}.
      responses:
        "200":
          description: Full manifest.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Manifest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/v1/series:
    get:
      tags: [data]
      operationId: listSeries
      parameters:
        - name: kind
          in: query
          schema: { $ref: "#/components/schemas/SeriesKind" }
      responses:
        "200":
          description: Series catalogue (FR-015a).
          content:
            application/json:
              schema:
                type: object
                required: [series]
                properties:
                  series:
                    type: array
                    items: { $ref: "#/components/schemas/Series" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/v1/series/{seriesId}/chunks/{year}:
    get:
      tags: [data]
      operationId: getPrivateChunk
      parameters:
        - $ref: "#/components/parameters/SeriesId"
        - name: year
          in: path
          required: true
          schema: { type: integer, minimum: 1980, maximum: 2100 }
      responses:
        "200":
          description: |
            Year chunk for any series. `Cache-Control: private, max-age=31536000, immutable` for closed years,
            `private, max-age=300` for the current year.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Chunk" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/series/{seriesId}/values:
    get:
      tags: [data]
      operationId: getSeriesValues
      description: Values for a date range, optionally converted to AUD (FR-015a, FR-006e).
      parameters:
        - $ref: "#/components/parameters/SeriesId"
        - { name: from, in: query, required: true, schema: { type: string, format: date } }
        - { name: to, in: query, required: true, schema: { type: string, format: date } }
        - name: currency
          in: query
          schema: { type: string, enum: [AUD, local], default: AUD }
      responses:
        "200":
          description: Points in date order. CSV with `Accept text/csv` (FR-015).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SeriesValues" }
            text/csv:
              schema: { type: string }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/performance:
    get:
      tags: [data]
      operationId: comparePerformance
      description: Period statistics for several series on a common baseline (FR-011). Used by MCP compare_performance.
      parameters:
        - name: series
          in: query
          required: true
          style: form
          explode: false
          schema: { type: array, items: { type: string }, minItems: 1, maxItems: 20 }
        - { name: from, in: query, required: true, schema: { type: string, format: date } }
        - { name: to, in: query, required: true, schema: { type: string, format: date } }
        - name: currency
          in: query
          schema: { type: string, enum: [AUD, local], default: AUD }
      responses:
        "200":
          description: One stats row per series.
          content:
            application/json:
              schema:
                type: object
                required: [from, to, currency, results]
                properties:
                  from: { type: string, format: date }
                  to: { type: string, format: date }
                  currency: { type: string }
                  results:
                    type: array
                    items: { $ref: "#/components/schemas/PeriodStats" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/v1/sources:
    get:
      tags: [update]
      operationId: listSources
      responses:
        "200":
          description: Source status and last successful update (FR-007).
          content:
            application/json:
              schema:
                type: object
                required: [sources]
                properties:
                  sources:
                    type: array
                    items: { $ref: "#/components/schemas/DataSource" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/v1/sources/{sourceId}/imports:
    post:
      tags: [update]
      operationId: importSourceFile
      description: Owner-assisted import fallback (research R7). Owner token or key.
      parameters:
        - name: sourceId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          text/csv:
            schema: { type: string, maxLength: 5000000 }
      responses:
        "202":
          description: Accepted; processed by an update run.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UpdateRun" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/v1/refresh:
    post:
      tags: [update]
      operationId: requestRefresh
      description: Start an update now (FR-008). The only write allowed with an API key (FR-015b).
      responses:
        "202":
          description: Started.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UpdateRun" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429":
          description: Within the 5-minute cooldown (FR-018).
          headers:
            Retry-After: { schema: { type: integer } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/v1/runs:
    get:
      tags: [update]
      operationId: listRuns
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 50, default: 10 }
      responses:
        "200":
          description: Most recent runs first.
          content:
            application/json:
              schema:
                type: object
                required: [runs]
                properties:
                  runs:
                    type: array
                    items: { $ref: "#/components/schemas/UpdateRun" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/v1/runs/{runId}:
    get:
      tags: [update]
      operationId: getRun
      parameters:
        - { name: runId, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: One run.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UpdateRun" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/watchlist:
    get:
      tags: [owner]
      operationId: getWatchlist
      security: [{ ownerToken: [] }, { apiKey: [] }]
      responses:
        "200":
          description: Watchlist and UI preferences.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Watchlist" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/v1/watchlist/{seriesId}:
    put:
      tags: [owner]
      operationId: putWatchlistEntry
      security: [{ ownerToken: [] }]
      parameters:
        - $ref: "#/components/parameters/SeriesId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [group]
              properties:
                group: { type: string, enum: [invested, considering] }
      responses:
        "204": { description: Saved. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [owner]
      operationId: deleteWatchlistEntry
      security: [{ ownerToken: [] }]
      parameters:
        - $ref: "#/components/parameters/SeriesId"
      responses:
        "204": { description: Removed (idempotent). }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/v1/preferences:
    put:
      tags: [owner]
      operationId: putPreferences
      security: [{ ownerToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Preferences" }
      responses:
        "204": { description: Saved. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/v1/keys:
    get:
      tags: [owner]
      operationId: listKeys
      security: [{ ownerToken: [] }]
      responses:
        "200":
          description: Keys without secrets.
          content:
            application/json:
              schema:
                type: object
                required: [keys]
                properties:
                  keys:
                    type: array
                    items: { $ref: "#/components/schemas/AccessKey" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [owner]
      operationId: createKey
      security: [{ ownerToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [label]
              properties:
                label: { type: string, minLength: 1, maxLength: 60 }
      responses:
        "201":
          description: The full key is returned **once**.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/AccessKey"
                  - type: object
                    required: [key]
                    properties:
                      key: { type: string, description: "sl_<keyId>_<secret>" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/v1/keys/{keyId}:
    delete:
      tags: [owner]
      operationId: revokeKey
      security: [{ ownerToken: [] }]
      parameters:
        - { name: keyId, in: path, required: true, schema: { type: string } }
      responses:
        "204": { description: Revoked; refused from the next request on. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

components:
  securitySchemes:
    ownerToken:
      type: apiKey
      in: header
      name: X-SuperLens-Token
      description: Cognito access token of the owner (web app).
    apiKey:
      type: apiKey
      in: header
      name: X-Api-Key
      description: Owner-issued tool key `sl_<keyId>_<secret>`. Read-only except POST /refresh and imports.

  parameters:
    SeriesId:
      name: seriesId
      in: path
      required: true
      schema: { type: string, pattern: "^[a-z][a-z0-9-]{1,30}\\.[a-z0-9-]{1,60}$" }

  responses:
    BadRequest:
      description: Invalid input.
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    Unauthorized:
      description: Missing, invalid or revoked credentials.
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    Forbidden:
      description: Authenticated, but this action needs the owner's sign-in (not an API key).
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    NotFound:
      description: Not found.
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    Conflict:
      description: An update is already running.
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }

  schemas:
    Error:
      type: object
      required: [code, message]
      properties:
        code: { type: string }
        message: { type: string }

    SeriesKind: { type: string, enum: [option, index, fx, other] }
    Visibility: { type: string, enum: [public, private] }

    DataSource:
      type: object
      required: [id, name, visibility, attribution, mode]
      properties:
        id: { type: string }
        name: { type: string }
        visibility: { $ref: "#/components/schemas/Visibility" }
        attribution: { type: string }
        mode: { type: string, enum: [fetch, import] }
        lastSuccessAt: { type: [string, "null"], format: date-time }
        lastAttemptAt: { type: [string, "null"], format: date-time }
        lastError: { type: [string, "null"] }
        backfill:
          type: object
          properties:
            state: { type: string, enum: [pending, running, complete] }
            cursor: { type: [string, "null"], format: date }

    Series:
      type: object
      required: [id, sourceId, name, kind, valueType, market, currency, visibility, status]
      properties:
        id: { type: string }
        sourceId: { type: string }
        name: { type: string }
        kind: { $ref: "#/components/schemas/SeriesKind" }
        valueType: { type: string, enum: [return_pct, level] }
        market: { type: string }
        currency: { type: string, pattern: "^[A-Z]{3}$" }
        visibility: { $ref: "#/components/schemas/Visibility" }
        note: { type: string }
        firstDate: { type: string, format: date }
        lastDate: { type: string, format: date }
        status: { type: string, enum: [active, discontinued] }

    Manifest:
      type: object
      required: [version, generatedAt, sources, series]
      properties:
        version: { const: 1 }
        generatedAt: { type: string, format: date-time }
        sources:
          type: array
          items: { $ref: "#/components/schemas/DataSource" }
        series:
          type: array
          items:
            allOf:
              - $ref: "#/components/schemas/Series"
              - type: object
                required: [chunks]
                properties:
                  chunks:
                    type: object
                    description: Year → chunk URL (relative to the origin).
                    additionalProperties: { type: string }

    Chunk:
      type: object
      required: [seriesId, year, points]
      properties:
        seriesId: { type: string }
        year: { type: integer }
        points:
          type: array
          description: "[date, value] or [date, value, revisedAt], sorted by date, unique dates."
          items:
            type: array
            minItems: 2
            maxItems: 3
            prefixItems:
              - { type: string, format: date }
              - { type: number }
              - { type: string, format: date-time }

    SeriesValues:
      type: object
      required: [seriesId, currency, valueType, points]
      properties:
        seriesId: { type: string }
        currency: { type: string }
        valueType: { type: string, enum: [return_pct, level] }
        converted: { type: boolean, description: true when values were converted to AUD }
        points:
          type: array
          items:
            type: object
            required: [date, value]
            properties:
              date: { type: string, format: date }
              value: { type: number }
        gaps:
          type: array
          description: Dates left out because no exchange rate existed within 5 days.
          items: { type: string, format: date }

    PeriodStats:
      type: object
      required: [seriesId, firstDate, lastDate, totalReturnPct]
      properties:
        seriesId: { type: string }
        firstDate: { type: string, format: date, description: first available date inside the range }
        lastDate: { type: string, format: date }
        totalReturnPct: { type: number }
        bestDay: { $ref: "#/components/schemas/DayValue" }
        worstDay: { $ref: "#/components/schemas/DayValue" }
        maxDrawdownPct: { type: number, description: "≤ 0" }
        note: { type: string, description: "e.g. price index, excludes dividends" }

    DayValue:
      type: object
      required: [date, returnPct]
      properties:
        date: { type: string, format: date }
        returnPct: { type: number }

    UpdateRun:
      type: object
      required: [runId, trigger, status, startedAt]
      properties:
        runId: { type: string }
        trigger: { type: string, enum: [schedule, manual, import] }
        status: { type: string, enum: [running, succeeded, partial, failed] }
        startedAt: { type: string, format: date-time }
        finishedAt: { type: [string, "null"], format: date-time }
        perSource:
          type: array
          items:
            type: object
            required: [sourceId]
            properties:
              sourceId: { type: string }
              from: { type: string, format: date }
              to: { type: string, format: date }
              daysAdded: { type: integer }
              daysRevised: { type: integer }
              newSeries: { type: array, items: { type: string } }
              error: { type: [string, "null"] }

    Watchlist:
      type: object
      required: [entries, preferences]
      properties:
        entries:
          type: array
          items:
            type: object
            required: [seriesId, group, addedAt]
            properties:
              seriesId: { type: string }
              group: { type: string, enum: [invested, considering] }
              addedAt: { type: string, format: date-time }
        preferences: { $ref: "#/components/schemas/Preferences" }

    Preferences:
      type: object
      properties:
        period: { type: string, enum: [1W, 1M, 3M, 6M, FYTD, 1Y, 3Y, ALL, CUSTOM] }
        customFrom: { type: string, format: date }
        customTo: { type: string, format: date }
        currencyView: { type: string, enum: [AUD, local] }
        comparisonSeries: { type: array, items: { type: string } }

    AccessKey:
      type: object
      required: [keyId, label, createdAt]
      properties:
        keyId: { type: string }
        label: { type: string }
        createdAt: { type: string, format: date-time }
        lastUsedAt: { type: [string, "null"], format: date-time }
        revokedAt: { type: [string, "null"], format: date-time }
